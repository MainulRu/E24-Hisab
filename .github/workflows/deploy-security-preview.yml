name: Deploy Security Branch Preview

on:
  push:
    branches:
      - security/backend-hardening-2026-11-24
    paths:
      - "docs/**"
      - ".github/workflows/deploy-security-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-pages-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Security Branch
        uses: actions/checkout@v4
        with:
          ref: security/backend-hardening-2026-11-24

      - name: Deploy isolated Cloudflare Pages preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./docs --project-name=e24-hisab-security-preview --branch=security/backend-hardening-2026-11-24
