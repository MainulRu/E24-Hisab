name: Format E24 HTML CSS JS

on:
  push:
    paths:
      - '.github/workflows/format-code.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Format HTML, CSS and JavaScript
        run: |
          npx --yes prettier@3.6.2 --write \
            "docs/index.html" "docs/pages/**/*.html" \
            "docs/css/**/*.css" "docs/js/**/*.js" \
            "app/src/main/assets/index.html" "app/src/main/assets/pages/**/*.html" \
            "app/src/main/assets/css/**/*.css" "app/src/main/assets/js/**/*.js"

      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs app/src/main/assets
            git commit -m "Format HTML CSS and JavaScript files"
            git push
          else
            echo "All targeted files are already formatted."
          fi
