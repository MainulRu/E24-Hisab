plugins { id 'com.android.application' }

android {
    namespace 'com.e24hisab'
    compileSdk 35

    defaultConfig {
        applicationId 'com.e24hisab'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

// Build the runtime index.html from real HTML page fragments.
def generatedE24Assets = layout.buildDirectory.dir("generated/e24Assets")

tasks.register("assembleE24Pages") {
    inputs.file("src/main/assets/index.html")
    inputs.file("src/main/assets/pages/home.html")
    outputs.dir(generatedE24Assets)

    doLast {
        def templateFile = file("src/main/assets/index.html")
        def pageFile = file("src/main/assets/pages/home.html")
        def html = templateFile.getText("UTF-8")
        def marker = "<!-- E24_PAGE:1 -->"
        if (html.count(marker) != 1) {
            throw new GradleException("Expected exactly one Home page marker in index.html")
        }
        def pageHtml = pageFile.getText("UTF-8")
        if (!pageHtml.contains('id="page-1"')) {
            throw new GradleException("Home page fragment does not contain page-1")
        }
        def outputDir = generatedE24Assets.get().asFile
        project.delete(outputDir)
        outputDir.mkdirs()

        // Copy every Android asset except the source index.html.
        fileTree("src/main/assets").visit { details ->
            if (!details.directory && details.relativePath.pathString != "index.html") {
                def target = new File(outputDir, details.relativePath.pathString)
                target.parentFile.mkdirs()
                target.bytes = details.file.bytes
            }
        }

        // Package the assembled page as the only assets/index.html.
        def outputFile = new File(outputDir, "index.html")
        outputFile.setText(html.replace(marker, pageHtml), "UTF-8")
    }
}

// Package the assembled asset directory without duplicate index.html files.
android.sourceSets.main.assets.setSrcDirs([generatedE24Assets])
tasks.named("preBuild").configure {
    dependsOn("assembleE24Pages")
}
