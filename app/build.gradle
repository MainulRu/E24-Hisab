plugins { id 'com.android.application' }

android {
    namespace 'com.e24hisab'
    compileSdk 35

    defaultConfig {
        applicationId 'com.e24hisab'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

 
// Build the runtime index.html from real HTML page fragments. The source template
// stays separate so Web and Android can share the same page markup.
def generatedE24Assets = layout.buildDirectory.dir("generated/e24Assets")

tasks.register("assembleE24Pages") {
    inputs.file("src/main/assets/template/index.html")
    inputs.file("src/main/assets/pages/home.html")
    outputs.file(generatedE24Assets.map { it.file("index.html") })

    doLast {
        def templateFile = file("src/main/assets/template/index.html")
        def pageFile = file("src/main/assets/pages/home.html")
        def html = templateFile.getText("UTF-8")
        def marker = "<!-- E24_PAGE:1 -->"
        if (html.count(marker) != 1) {
            throw new GradleException("Expected exactly one Home page marker in template/index.html")
        }
        def pageHtml = pageFile.getText("UTF-8")
        if (!pageHtml.contains('id="page-1"')) {
            throw new GradleException("Home page fragment does not contain page-1")
        }
        def outputFile = generatedE24Assets.get().file("index.html").asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText(html.replace(marker, pageHtml), "UTF-8")
    }
}

android.sourceSets.main.assets.srcDir(generatedE24Assets)
tasks.named("preBuild").configure {
    dependsOn("assembleE24Pages")
}
