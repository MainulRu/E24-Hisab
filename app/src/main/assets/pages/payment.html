<div class="app-page" id="page-5">
          <div class="payment-header">
            <div class="profile-avatar-small"><i class="fa-solid fa-user"></i></div>
            <div class="payment-user-info">
              <div class="name" id="e24-payment-customer-name">গ্রাহক নির্বাচন করুন</div>
              <div class="due-text" id="e24-payment-customer-phone">মোবাইল নম্বর নেই</div>
            </div>
          </div>
          <div class="payment-amount-box" id="e24-payment-customer-due">বকেয়া পরিমাণ: ৳ ০</div>
          <div class="form-group" style="margin-top:10px">
            <label class="form-label" for="e24-payment-amount">যে পরিমাণ টাকা পেমেন্ট করবে (৳):</label>
            <input id="e24-payment-amount" class="form-input" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="পেমেন্টের পরিমাণ">
            <small id="e24-payment-amount-hint" style="display:block;margin-top:4px;color:#667085">সর্বোচ্চ বকেয়ার সমান টাকা দেওয়া যাবে।</small>
          </div>
          <div class="form-label" style="font-weight:700; margin-bottom:5px;">পেমেন্ট মাধ্যম নির্বাচন করুন:</div>
          <div class="payment-options" id="e24-payment-method-options">
            <label class="pay-option" id="e24-pay-option-bkash"><input type="radio" name="pay" value="bkash" onchange="e24RenderPaymentPage()"><i class="fa-solid fa-mobile-button" style="color:#e91e63;"></i> বিকাশ দিয়ে পেমেন্ট</label>
            <label class="pay-option" id="e24-pay-option-nagad"><input type="radio" name="pay" value="nagad" onchange="e24RenderPaymentPage()"><i class="fa-solid fa-wallet" style="color:#f57c00;"></i> নগদ দিয়ে পেমেন্ট</label>
            <label class="pay-option" id="e24-pay-option-bank"><input type="radio" name="pay" value="bank" onchange="e24RenderPaymentPage()"><i class="fa-solid fa-building-columns" style="color:#1565c0;"></i> ব্যাংক পেমেন্ট</label>
            <label class="pay-option" id="e24-pay-option-cash"><input type="radio" name="pay" value="cash" checked onchange="e24RenderPaymentPage()"><i class="fa-solid fa-money-bill-1" style="color:#2e7d32;"></i> নগদ টাকা (Cash)</label>
          </div>
          <div id="e24-payment-account-details" class="sms-wallet-panel" style="margin-top:9px" aria-live="polite">
            <strong id="e24-payment-account-title">পেমেন্ট তথ্য</strong>
            <div id="e24-payment-account-content" class="sms-wallet-note" style="margin-top:6px">Settings থেকে পেমেন্ট তথ্য যোগ করুন।</div>
          </div>
          <button class="btn btn-pink shadow-btn" style="margin-top:8px;" onclick="showToast('এখনো বাস্তব পেমেন্ট গেটওয়ে যুক্ত হয়নি।')">
            <i class="fa-solid fa-paper-plane"></i> পেমেন্ট করুন
          </button>
        </div>
