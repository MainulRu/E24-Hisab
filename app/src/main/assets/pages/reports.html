<div class="app-page" id="page-7">
  <div class="report-tabs">
    <div
      class="rep-tab active"
      data-mode="daily"
      onclick="reportSetMode('daily')"
    >
      দৈনিক
    </div>
    <div class="rep-tab" data-mode="monthly" onclick="reportSetMode('monthly')">
      মাসিক
    </div>
    <div class="rep-tab" data-mode="yearly" onclick="reportSetMode('yearly')">
      বার্ষিক
    </div>
  </div>
  <div class="month-picker">
    <button
      type="button"
      class="report-arrow"
      onclick="reportShift(-1)"
      aria-label="আগের সময়"
    >
      <i class="fa-solid fa-chevron-left"></i>
    </button>
    <span id="report-period-label"
      ><i class="fa-regular fa-calendar"></i> রিপোর্ট</span
    >
    <button
      type="button"
      class="report-arrow"
      onclick="reportShift(1)"
      aria-label="পরের সময়"
    >
      <i class="fa-solid fa-chevron-right"></i>
    </button>
  </div>
  <div class="report-summary-grid">
    <div class="summary-box box-blue">
      <span>মোট বিক্রি</span><strong id="report-total-sales">৳ 0</strong>
    </div>
    <div class="summary-box box-green">
      <span>মোট জমা</span><strong id="report-total-paid">৳ 0</strong>
    </div>
    <div class="summary-box box-red">
      <span>সময়ের বাকি</span><strong id="report-total-due">৳ 0</strong>
    </div>
    <div class="summary-box box-blue">
      <span>অগ্রিম</span><strong id="report-total-advance">৳ 0</strong>
    </div>
  </div>
  <section class="supplier-report-panel">
    <div class="supplier-report-heading">
      <span><i class="fa-solid fa-truck"></i> সাপ্লায়ার রিপোর্ট</span
      ><small>নির্বাচিত সময়ের হিসাব</small>
    </div>
    <div class="supplier-report-grid">
      <div class="supplier-report-metric">
        <span>মোট ক্রয়</span><strong id="report-supplier-purchase">৳ 0</strong>
      </div>
      <div class="supplier-report-metric">
        <span>মোট পরিশোধ</span><strong id="report-supplier-paid">৳ 0</strong>
      </div>
      <div class="supplier-report-metric supplier-report-outstanding">
        <span>বর্তমান বকেয়া</span><strong id="report-supplier-due">৳ 0</strong>
      </div>
    </div>
  </section>
  <div class="chart-container">
    <div
      class="pie-chart"
      id="report-pie-chart"
      style="background: transparent"
    ></div>
    <div class="chart-legend">
      <div class="legend-item">
        <span
          class="legend-color"
          style="background: var(--primary-green)"
        ></span>
        <span id="report-paid-label">জমা (0%)</span>
      </div>
      <div class="legend-item">
        <span class="legend-color" style="background: var(--accent-red)"></span>
        <span id="report-due-label">বাকি (0%)</span>
      </div>
      <div class="report-total-count" id="report-tx-count">লেনদেন: ০টি</div>
    </div>
  </div>
  <div class="section-banner border-banner">
    <i class="fa-solid fa-list"></i> নির্বাচিত সময়ের লেনদেন
  </div>
  <ul class="e24-report-recent-list" id="report-transaction-list">
    <li class="e24-report-recent-empty">কোনো লেনদেন নেই</li>
  </ul>
  <button
    class="btn btn-blue shadow-btn"
    style="margin-top: 8px"
    onclick="printReport()"
  >
    <i class="fa-solid fa-print"></i> রিপোর্ট প্রিন্ট / PDF সংরক্ষণ
  </button>
</div>
