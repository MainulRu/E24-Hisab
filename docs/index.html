<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087a35">
<title>E24 Hisab — Live Preview</title>

<style>
:root{
 --g:#087a35;--gd:#075c2b;--red:#e53935;
 --blue:#1769c2;--purple:#7138c8;
 --bg:#f3f7f4;--ink:#202a24;--muted:#718078
}
*{box-sizing:border-box}
body{
 margin:0;background:#e7eee9;color:var(--ink);
 font-family:system-ui,"Noto Sans Bengali","Hind Siliguri",sans-serif
}
.app{
 max-width:480px;min-height:100vh;margin:auto;background:var(--bg);
 display:flex;flex-direction:column;box-shadow:0 0 30px #183b2520
}
header{
 height:62px;background:var(--g);color:white;
 display:flex;align-items:center;padding:0 16px;gap:14px;
 position:sticky;top:0;z-index:2
}
header .brand{font-size:20px;font-weight:800;flex:1}
header button{border:0;background:transparent;color:white;font-size:23px}
main{padding:16px 14px 90px;flex:1}
.page-title{font-size:19px;font-weight:750;margin:0 0 13px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.card{
 border-radius:14px;color:#fff;padding:13px;min-height:103px;
 box-shadow:0 3px 8px #00000012
}
.card .ico{display:flex;align-items:center}
.svgico{display:inline-block;vertical-align:middle;flex-shrink:0}
.card .ico .svgico{
 width:38px;height:38px;padding:6px;border-radius:12px;
 background:#ffffff2b;box-shadow:0 3px 9px #00000012;
 overflow:visible
}
.card .label{font-size:13px;font-weight:650;margin-top:4px}
.card .value{font-size:22px;font-weight:850;margin-top:3px}
.green{background:var(--g)}
.red{background:var(--red)}
.blue{background:var(--blue)}
.purple{background:var(--purple)}
.section{font-size:17px;font-weight:800;margin:20px 0 9px}
.row{
 display:flex;align-items:center;gap:10px;background:#fff;
 border-radius:12px;padding:11px;margin:7px 0;
 box-shadow:0 2px 5px #102a1710
}
.avatar{
 width:42px;height:42px;border-radius:50%;background:#e2efff;
 color:#1769c2;display:grid;place-items:center;
 font-size:22px;font-weight:800;flex-shrink:0
}
.grow{flex:1;min-width:0}
.name{font-weight:750}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.amount{font-weight:800;white-space:nowrap}
.deposit{color:var(--g)}
.due{color:var(--red)}
.expense{color:var(--blue)}
.btn{
 border:0;border-radius:11px;background:var(--g);color:#fff;
 font-weight:750;padding:13px 15px;font-size:14px;
 width:100%;margin:7px 0;cursor:pointer
}
.btn.bluebtn{background:var(--blue)}
.btn.purplebtn{background:var(--purple)}
.btn.light{background:#e7eee9;color:var(--g)}
.search,input,select,textarea{
 width:100%;border:1px solid #d4ded7;border-radius:10px;
 padding:12px;background:white;font:inherit;margin:5px 0;color:var(--ink)
}
.pill{
 padding:5px 9px;border-radius:30px;background:#ffebeb;
 color:var(--red);font-size:11px;font-weight:750;white-space:nowrap
}
.pill.ok{background:#e5f6eb;color:var(--g)}
nav{
 position:fixed;bottom:0;left:50%;transform:translateX(-50%);
 width:min(480px,100%);height:68px;background:#fff;
 box-shadow:0 -3px 14px #102a1715;
 display:grid;grid-template-columns:repeat(5,1fr);
 z-index:3;padding-bottom:env(safe-area-inset-bottom)
}
nav button{
 border:0;background:white;color:#65736a;font-size:11px;
 font-weight:700;display:flex;flex-direction:column;
 align-items:center;justify-content:center;gap:3px;
 cursor:pointer;touch-action:manipulation;
 -webkit-tap-highlight-color:transparent
}
nav button .ni{display:grid;place-items:center;width:30px;height:28px}
nav button .ni svg{width:25px;height:25px}
nav button.active{color:var(--g);background:#f0f8f2}
nav button:focus-visible{outline:2px solid var(--g);outline-offset:-3px}
.profile{
 display:flex;align-items:center;gap:12px;background:white;
 padding:14px;border-radius:14px
}
.profile .avatar{width:58px;height:58px;font-size:27px}
.toolbar{display:flex;gap:8px}
.toolbar>*{flex:1}
.empty{
 padding:22px;text-align:center;color:var(--muted);
 background:white;border-radius:12px
}
.modalback{
 position:fixed;inset:0;background:#0008;display:none;
 align-items:flex-end;justify-content:center;z-index:5
}
.modal{
 background:#fff;width:min(480px,100%);padding:20px;
 border-radius:20px 20px 0 0;max-height:88vh;overflow:auto
}
.modal h3{margin:0 0 12px}
.modal .actions{display:flex;gap:8px}
.modal .actions button{flex:1}
.note{font-size:12px;color:var(--muted);line-height:1.5}
@media(min-width:600px){
 body{padding:18px 0}
 .app{border-radius:24px;overflow:hidden;min-height:calc(100vh - 36px)}
 nav{bottom:18px;border-radius:0 0 24px 24px}
}
</style>
</head>

<body>
<div class="app">
<header>
 <button aria-label="menu" onclick="show('সেটিংস')">☰</button>
 <div class="brand">E24 Hisab</div>
 <button onclick="toast('নতুন নোটিফিকেশন নেই')" aria-label="notifications">♧</button>
</header>

<main id="main"></main>
<nav id="nav"></nav>
</div>

<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()">
 <div class="modal" id="modal"></div>
</div>

<script>
const defaults={
 page:'হোম',
 selected:null,
 customers:[
  {id:1,name:'রহিম মিয়া',phone:'01712-345678'},
  {id:2,name:'করিম উদ্দিন',phone:'01812-456789'}
 ],
 tx:[
  {cid:1,type:'জমা',amount:1000,note:'নগদ জমা',date:'17-11-2026'},
  {cid:1,type:'জমা',amount:25588,note:'পূর্বের জমা',date:'16-11-2026'},
  {cid:2,type:'বাকি',amount:5000,note:'পণ্য ক্রয়',date:'15-11-2026'}
 ]
};

let state;

try{
 const saved=JSON.parse(localStorage.getItem('e24hisab_preview_v2'));
 state=saved&&Array.isArray(saved.customers)&&Array.isArray(saved.tx)
  ?{...defaults,...saved}
  :structuredClone(defaults);
}catch(e){
 state=JSON.parse(JSON.stringify(defaults));
}

function persist(){
 try{
  localStorage.setItem('e24hisab_preview_v2',JSON.stringify(state));
 }catch(e){
  toast('ডেটা সংরক্ষণ করা যায়নি—ব্রাউজার স্টোরেজ পরীক্ষা করুন');
 }
}

const money=n=>'৳ '+Number(n||0).toLocaleString('en-IN');

const icon={
 হোম:'home',
 গ্রাহক:'users',
 নতুন:'plus-circle',
 রিপোর্ট:'chart',
 সেটিংস:'settings'
};

function svgIcon(name,size=22){
 const art={
  home:`
   <path d="M3 10.8 12 3l9 7.8v9.1a1.2 1.2 0 0 1-1.2 1.2h-5.1v-6.4h-5.4v6.4H4.2A1.2 1.2 0 0 1 3 19.9z"
   fill="#d8f5df" stroke="#087a35" stroke-width="1.5"/>
   <path d="m2.5 10.8 9.5-8 9.5 8" fill="none"
   stroke="#087a35" stroke-width="2" stroke-linecap="round"/>`,

  users:`
   <circle cx="9" cy="8" r="4" fill="#dcecff" stroke="#1769c2" stroke-width="1.5"/>
   <circle cx="17.5" cy="9" r="3" fill="#f1e7ff" stroke="#7138c8" stroke-width="1.4"/>
   <path d="M2.5 20a6.5 6.5 0 0 1 13 0" fill="#b9dcff" stroke="#1769c2" stroke-width="1.5"/>
   <path d="M15 15a5.3 5.3 0 0 1 6.5 5" fill="none" stroke="#7138c8" stroke-width="1.5" stroke-linecap="round"/>`,

  plus:`
   <circle cx="12" cy="12" r="9" fill="#e2f5e8" stroke="#087a35" stroke-width="1.7"/>
   <path d="M12 7v10M7 12h10" stroke="#087a35" stroke-width="2.4" stroke-linecap="round"/>`,

  'plus-circle':`
   <circle cx="12" cy="12" r="9" fill="#e2f5e8" stroke="#087a35" stroke-width="1.7"/>
   <path d="M12 7v10M7 12h10" stroke="#087a35" stroke-width="2.4" stroke-linecap="round"/>`,

  chart:`
   <rect x="3" y="3" width="18" height="18" rx="4" fill="#e6dcff" stroke="#7138c8" stroke-width="1.5"/>
   <path d="M7 16v-3m5 3V8m5 8v-6" stroke="#7138c8" stroke-width="2.2" stroke-linecap="round"/>
   <path d="m6 10 4-3 3 2 5-4" fill="none" stroke="#087a35" stroke-width="1.6" stroke-linecap="round"/>`,

  settings:`
   <path d="M10 2.8h4l.7 2.3 2 .9 2.2-1 2 3.5-1.7 1.7v2.2l1.7 1.7-2 3.5-2.2-1-2 .9-.7 2.3h-4l-.7-2.3-2-.9-2.2 1-2-3.5 1.7-1.7v-2.2L3.1 8.5l2-3.5 2.2 1 2-.9z"
   fill="#e7e2ff" stroke="#7138c8" stroke-width="1.4"/>
   <circle cx="12" cy="11.3" r="3.2" fill="#fff" stroke="#7138c8" stroke-width="1.7"/>`,

  deposit:`
   <rect x="2" y="2" width="20" height="20" rx="6" fill="#d9f6e2"/>
   <path d="M7 14.5h10M12 17V6m-4 4 4-4 4 4"
   fill="none" stroke="#087a35" stroke-width="2.2"
   stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M5 19h14" stroke="#087a35" stroke-width="1.5" stroke-linecap="round"/>`,

  due:`
   <rect x="2" y="2" width="20" height="20" rx="6" fill="#ffe0df"/>
   <path d="M7 9.5h10M12 7v11m-4-4 4 4 4-4"
   fill="none" stroke="#d62828" stroke-width="2.2"
   stroke-linecap="round" stroke-linejoin="round"/>
   <path d="M5 5l2 2m12-2-2 2"
   stroke="#d62828" stroke-width="1.5" stroke-linecap="round"/>`,

  expense:`
   <rect x="2.5" y="5" width="19" height="14" rx="3"
   fill="#dcecff" stroke="#1769c2" stroke-width="1.5"/>
   <path d="M3 9h18" stroke="#1769c2" stroke-width="1.5"/>
   <circle cx="16.5" cy="14" r="2" fill="#fff" stroke="#1769c2" stroke-width="1.3"/>
   <path d="M6 14h4" stroke="#1769c2" stroke-width="1.7" stroke-linecap="round"/>`,

  person:`
   <circle cx="12" cy="8" r="4" fill="#dcecff" stroke="#1769c2" stroke-width="1.5"/>
   <path d="M4 21a8 8 0 0 1 16 0" fill="#b9dcff" stroke="#1769c2" stroke-width="1.5"/>`
 };

 return `<svg class="svgico" width="${size}" height="${size}"
 viewBox="0 0 24 24" aria-hidden="true"
 xmlns="http://www.w3.org/2000/svg">${art[name]||art.home}</svg>`;
}

function customerDue(id){
 return Math.max(0,state.tx
  .filter(t=>t.cid===id)
  .reduce((sum,t)=>sum+
   (t.type==='বাকি'?t.amount:
    t.type==='জমা'?-t.amount:0),0));
}

function totals(){
 let a=0,e=0;

 state.tx.forEach(t=>{
  if(t.type==='জমা')a+=Number(t.amount)||0;
  else if(t.type==='খরচ')e+=Number(t.amount)||0;
 });

 let b=state.customers.reduce((sum,c)=>sum+customerDue(c.id),0);
 return {a,b,e};
}

function nav(){
 const el=document.getElementById('nav');

 el.innerHTML=['হোম','গ্রাহক','নতুন','রিপোর্ট','সেটিংস']
 .map(p=>`
  <button type="button"
   class="${state.page===p?'active':''}"
   data-nav-page="${p}" aria-label="${p}">
   <span class="ni">${svgIcon(icon[p],25)}</span>
   <span>${p}</span>
  </button>
 `).join('');
}

// Navigation event delegation
document.getElementById('nav').addEventListener('click',function(event){
 const button=event.target.closest('button[data-nav-page]');
 if(!button)return;

 const page=button.getAttribute('data-nav-page');

 if(page==='নতুন'){
  transactionModal();
  return;
 }

 show(page);
});

function show(p){
 state.page=p;
 nav();

 let m=document.getElementById('main');

 if(p==='হোম')home(m);
 else if(p==='গ্রাহক')customers(m);
 else if(p==='খাতা')ledger(m);
 else if(p==='রিপোর্ট')reports(m);
 else if(p==='মেসেজ')messages(m);
 else settings(m);
}

function home(m){
 let t=totals();

 m.innerHTML=`
  <div class="page-title">${svgIcon('chart',23)} আজকের সারাংশ</div>

  <div class="cards">
   <div class="card green">
    <div class="ico">${svgIcon('deposit',38)}</div>
    <div class="label">মোট জমা</div>
    <div class="value">${money(t.a)}</div>
   </div>

   <div class="card red">
    <div class="ico">${svgIcon('due',38)}</div>
    <div class="label">মোট বাকি</div>
    <div class="value">${money(t.b)}</div>
   </div>

   <div class="card blue">
    <div class="ico">${svgIcon('expense',38)}</div>
    <div class="label">মোট খরচ</div>
    <div class="value">${money(t.e)}</div>
   </div>

   <div class="card purple">
    <div class="ico">${svgIcon('users',38)}</div>
    <div class="label">মোট গ্রাহক</div>
    <div class="value">${state.customers.length}</div>
   </div>
  </div>

  <div class="section">${svgIcon('chart',20)} সাম্প্রতিক লেনদেন</div>

  ${state.tx.slice().reverse().slice(0,10).map(txrow).join('')
   ||'<div class="empty">এখনো কোনো লেনদেন নেই</div>'}

  <button class="btn" onclick="customerModal()">＋ নতুন গ্রাহক যোগ করুন</button>
 `;
}

function txrow(t){
 let c=state.customers.find(x=>x.id===t.cid)||{name:'গ্রাহক'};
 let cl=t.type==='জমা'?'deposit':t.type==='বাকি'?'due':'expense';
 let ic=t.type==='জমা'?'deposit':t.type==='বাকি'?'due':'expense';

 return `
  <div class="row">
   <div class="avatar">${svgIcon(ic,22)}</div>
   <div class="grow">
    <div class="name">${c.name}</div>
    <div class="sub">${t.type} • ${t.date}</div>
   </div>
   <div class="amount ${cl}">${money(t.amount)}</div>
  </div>
 `;
}

function customers(m){
 m.innerHTML=`
  <div class="page-title">♟ গ্রাহক তালিকা</div>
  <input class="search" placeholder="⌕ নাম দিয়ে খুঁজুন..."
   oninput="filterCustomers(this.value)">
  <button class="btn" onclick="customerModal()">＋ নতুন গ্রাহক যোগ করুন</button>
  <div id="customerlist">${customerRows(state.customers)}</div>
 `;
}

function customerRows(arr){
 return arr.map(c=>{
  let due=customerDue(c.id);

  return `
   <div class="row" onclick="state.selected=${c.id};show('খাতা')">
    <div class="avatar">${svgIcon('person',22)}</div>
    <div class="grow">
     <div class="name">${c.name}</div>
     <div class="sub">${c.phone||'মোবাইল নম্বর নেই'}</div>
    </div>
    <span class="pill ${due<=0?'ok':''}">বাকি ${money(Math.max(0,due))}</span>
   </div>
  `;
 }).join('')||'<div class="empty">কোনো গ্রাহক পাওয়া যায়নি</div>';
}

function filterCustomers(q){
 document.getElementById('customerlist').innerHTML=
 customerRows(state.customers.filter(c=>
  c.name.toLowerCase().includes(q.toLowerCase())||
  c.phone.includes(q)
 ));
}

function ledger(m){
 let c=state.customers.find(x=>x.id===state.selected);

 if(!c){
  show('গ্রাহক');
  return;
 }

 let tx=state.tx.filter(t=>t.cid===c.id);

 let a=tx.filter(t=>t.type==='জমা')
  .reduce((s,t)=>s+t.amount,0);

 let gross=tx.filter(t=>t.type==='বাকি')
  .reduce((s,t)=>s+t.amount,0);

 let b=Math.max(0,gross-a);

 m.innerHTML=`
  <div class="profile">
   <div class="avatar">${svgIcon('person',30)}</div>
   <div>
    <div class="name">${c.name}</div>
    <div class="sub">☎ ${c.phone||'মোবাইল নম্বর নেই'}</div>
   </div>
  </div>

  <div class="cards" style="margin-top:10px">
   <div class="card green">
    <div class="ico">${svgIcon('deposit',38)}</div>
    <div class="label">মোট জমা</div>
    <div class="value">${money(a)}</div>
   </div>

   <div class="card red">
    <div class="ico">${svgIcon('due',38)}</div>
    <div class="label">মোট বাকি</div>
    <div class="value">${money(b)}</div>
   </div>
  </div>

  <button class="btn bluebtn" onclick="transactionModal(${c.id})">＋ নতুন লেনদেন</button>
  <button class="btn purplebtn" onclick="show('মেসেজ')">✉ মেসেজ পাঠান</button>

  <div class="section">▤ লেনদেনের ইতিহাস</div>

  ${tx.slice().reverse().map(txrow).join('')
   ||'<div class="empty">এখনো কোনো লেনদেন নেই</div>'}

  <p class="note">জমা দিলে মোট বাকি থেকে স্বয়ংক্রিয়ভাবে বাদ হবে। বাকি শূন্যের নিচে যাবে না।</p>
 `;
}

function reports(m){
 let t=totals();

 m.innerHTML=`
  <div class="page-title">▥ হিসাব রিপোর্ট</div>

  <div class="cards">
   <div class="card green">
    <div class="label">মোট জমা</div>
    <div class="value">${money(t.a)}</div>
   </div>

   <div class="card red">
    <div class="label">মোট বাকি</div>
    <div class="value">${money(t.b)}</div>
   </div>

   <div class="card blue">
    <div class="label">মোট খরচ</div>
    <div class="value">${money(t.e)}</div>
   </div>

   <div class="card purple">
    <div class="label">গ্রাহক</div>
    <div class="value">${state.customers.length}</div>
   </div>
  </div>

  <div class="section">লেনদেনের সারাংশ</div>

  ${state.tx.slice().reverse().map(txrow).join('')}

  <p class="note">এটি ব্রাউজারভিত্তিক ডেমো; বাস্তব APK-এর SQLite ডেটার সঙ্গে সংযুক্ত নয়।</p>
 `;
}

function messages(m){
 m.innerHTML=`
  <div class="page-title">মেসেজ</div>
  <div class="empty">SMS ও WhatsApp পাঠানোর সুবিধা পরবর্তী সংস্করণে সংযুক্ত হবে।</div>
  <button class="btn light" onclick="show('খাতা')">খাতায় ফিরে যান</button>
 `;
}

function settings(m){
 m.innerHTML=`
  <div class="page-title">⚙ সেটিংস</div>

  ${[
   '▣ ডেটা ব্যাকআপ ও রিস্টোর',
   '৳ পেমেন্ট সেটিংস',
   '☏ SMS ও WhatsApp',
   '♙ নিরাপত্তা (PIN Lock)',
   '◎ ভাষা নির্বাচন (বাংলা)',
   'ⓘ অ্যাপ সম্পর্কে'
  ].map(x=>`
   <div class="row">
    <div class="grow">${x}</div>
    <b>›</b>
   </div>
  `).join('')}

  <p class="note">Live Preview-তে পেমেন্ট, SMS, WhatsApp ও ক্লাউড ব্যাকআপ কেবল UI নমুনা; সংযুক্ত নয়।</p>
 `;
}

function modal(content){
 document.getElementById('modal').innerHTML=content;
 document.getElementById('modalback').style.display='flex';
}

function closeModal(){
 document.getElementById('modalback').style.display='none';
}

function customerModal(){
 modal(`
  <h3>নতুন গ্রাহক</h3>
  <input id="cn" placeholder="গ্রাহকের নাম">
  <input id="cp" placeholder="মোবাইল নম্বর">

  <div class="actions">
   <button class="btn light" onclick="closeModal()">বাতিল</button>
   <button class="btn" onclick="saveCustomer()">সংরক্ষণ</button>
  </div>
 `);
}

function saveCustomer(){
 let n=document.getElementById('cn').value.trim();
 let p=document.getElementById('cp').value.trim();

 if(!n){
  toast('গ্রাহকের নাম লিখুন');
  return;
 }

 state.customers.push({
  id:Date.now(),
  name:n,
  phone:p
 });

 persist();
 closeModal();
 show('গ্রাহক');
}

function transactionModal(cid){
 state.returnPage=cid?'খাতা':(state.page==='নতুন'?'হোম':state.page);

 if(!state.customers.length){
  toast('আগে গ্রাহক যোগ করুন');
  return;
 }

 let opts=state.customers.map(c=>`
  <option value="${c.id}" ${cid===c.id?'selected':''}>${c.name}</option>
 `).join('');

 modal(`
  <h3>নতুন লেনদেন</h3>

  <label>গ্রাহক</label>
  <select id="tc">${opts}</select>

  <label>লেনদেনের ধরন</label>
  <select id="tt">
   <option>জমা</option>
   <option>বাকি</option>
   <option>খরচ</option>
  </select>

  <input id="ta" type="number" min="1" placeholder="টাকার পরিমাণ">
  <input id="tn" placeholder="বিবরণ">

  <div class="actions">
   <button class="btn light" onclick="closeModal()">বাতিল</button>
   <button class="btn" onclick="saveTx()">সংরক্ষণ</button>
  </div>
 `);
}

function saveTx(){
 let amount=Number(document.getElementById('ta').value);

 if(!amount||amount<1){
  toast('সঠিক টাকার পরিমাণ লিখুন');
  return;
 }

 state.tx.push({
  cid:Number(document.getElementById('tc').value),
  type:document.getElementById('tt').value,
  amount,
  note:document.getElementById('tn').value,
  date:new Date().toLocaleDateString('en-GB')
 });

 persist();
 closeModal();
 show(state.returnPage||'হোম');
}

function toast(s){
 let d=document.createElement('div');
 d.textContent=s;
 d.style='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#26352b;color:white;padding:12px 18px;border-radius:30px;z-index:9';
 document.body.append(d);
 setTimeout(()=>d.remove(),1800);
}

persist();
show('হোম');
</script>
</body>
</html>
